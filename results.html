<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spellcheck - A Word Game | Results</title>
  <link rel="stylesheet" href="assets/styles/large_style.css" media="(min-width: 801px)">
  <link rel="stylesheet" href="assets/styles/mobile_style.css" media="(max-width: 800px)">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.3.0/css/all.min.css">
  <link rel="icon" type="image/x-icon" href="assets/icons/spellcheck.png">
  <script src="assets/scripts/theme.js" defer></script>
</head>
<body>
  <div class="header">
    <div id="header-with-menu">
      <h1 class="boxed" id="header-title"><span class="">Spellcheck</span></h1>
      <button type="button" id="theme-toggle" class="theme-toggle" aria-label="Switch theme" title="Switch theme">☾</button>
    </div>
</div>
<div class="content">
  <h3 class="boxed">Results</h3>
  <h1 id="results"></h1>
  <button type="button" class="btn boxed primary-action" id="copy-btn">
    <i class="fa fa-copy" aria-hidden="true"></i>&ensp;Copy results
  </button>
  <p id="copy-status" class="copy-status" aria-live="polite"></p>
  <br>
  <a href="mode_select.html" class="btn boxed">
        Play again <i class="fa fa-arrow-right" aria-hidden="true"></i>
  </a>
  <h3 class="boxed">Your Typos</h3>
  <table id="typos"></table>
  <br>
  <a href="mailto:lobhasap@gmail.com?subject=Spellcheck Bug Report" target="_blank" >
    <div class="btn boxed">
      <i class="fa fa-bug" style="font-size:10pt;"></i>&ensp;report a bug
    </div>
  </a>

</div>
<br>
  <script src="assets/scripts/results.js"></script>
</body>
</html>
