<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spellcheck - A Word Game | Select Mode</title>
    <link rel="stylesheet" href="assets/styles/large_style.css" media="(min-width: 801px)">
    <link rel="stylesheet" href="assets/styles/mobile_style.css" media="(max-width: 800px)">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.3.0/css/all.min.css">
    <link rel="icon" type="image/x-icon" href="assets/icons/spellcheck.png">
    <script src="assets/scripts/theme.js" defer></script>

</head>
<body class="mode-select-page">
    
    <div class="header">
        <div id="header-with-menu" class="has-menu">
            <a href="index.html" class="boxed btn" id="header-menu"><i class="fa fa-arrow-left" style="font-size:30pt; padding:0%"></i></a>
            <h1 class="boxed" id="header-title"><span class="">Spellcheck</span></h1>
            <button type="button" id="theme-toggle" class="theme-toggle" aria-label="Switch theme" title="Switch theme">☾</button>
        </div>
    </div>

    <main class="content mode-selection">
        <p class="mode-intro">Choose how you want to play</p>

        <section class="mode-card" aria-labelledby="daily-mode-title">
            <div>
                <h2 id="daily-mode-title">Daily challenge</h2>
                <p>A fresh set of words every day. Complete all three rounds and see your results.</p>
            </div>
            <a class="mode-action primary-action" id="daily-challenge-link" href="solo_game.html">
                Play daily challenge <i class="fa-solid fa-calendar" aria-hidden="true"></i>
            </a>
        </section>

        <section class="mode-card" aria-labelledby="practice-mode-title">
            <div>
                <h2 id="practice-mode-title">Practice mode</h2>
                <p>Choose a difficulty and spell as many words as you can before you run out of lives.</p>
            </div>
            <fieldset class="difficulty-picker">
                <legend>Choose difficulty</legend>
                <div class="switch-field">
                    <input type="radio" name="difficulty-switch" id="easy" />
                    <label for="easy">Easy</label>
                    <input type="radio" name="difficulty-switch" id="medium" checked />
                    <label for="medium">Medium</label>
                    <input type="radio" name="difficulty-switch" id="hard" />
                    <label for="hard">Hard</label>
                </div>
            </fieldset>
            <a class="mode-action" id="start-practice-btn" href="practice_game.html">
                Start practice <i class="fa-solid fa-dumbbell" aria-hidden="true"></i>
            </a>
        </section>
    </main>
</body>
<script>
    // record the practice level setting
    const radios = document.querySelectorAll('input[name="difficulty-switch"]');
    sessionStorage.setItem("level", 'medium');
    radios.forEach(radio => {
        radio.addEventListener('click', function () {
            radioVal = radio.id;
            sessionStorage.setItem("level", radioVal);
            console.log(radioVal)
        });
    });
    document.querySelector('#start-practice-btn').addEventListener('click', () => {
        sessionStorage.removeItem('spellcheck-practice-progress');
    });

    const todayInNewYork = new Date().toLocaleDateString("en-US", { timeZone: "America/New_York" });
    const currentPuzzle = String(Math.round((new Date(todayInNewYork).getTime() - new Date("1/12/2024").getTime()) / (1000 * 60 * 60 * 24)));
    const dailyLink = document.querySelector('#daily-challenge-link');
    try {
        if (localStorage.getItem("dailyCompletedPuzzle") === currentPuzzle) {
            dailyLink.classList.remove("primary-action");
            dailyLink.classList.add("is-completed");
            dailyLink.innerHTML = 'Completed for today <i class="fa-solid fa-check" aria-hidden="true"></i>';
            dailyLink.setAttribute("aria-disabled", "true");
            dailyLink.addEventListener("click", event => event.preventDefault());
        }
    } catch (error) {
        // Leave the daily challenge available if browser storage is unavailable.
    }
</script>
</html>
